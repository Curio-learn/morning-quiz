<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Morning Briefing Quiz</title>
<style>
/* Layout: one centred column, one question card at a time feel, all questions visible, score bar sticky at bottom */
:root{--bg:#f6f7f9;--card:#ffffff;--ink:#16202b;--muted:#5f6873;--navy:#1f3a5f;--line:#dde1e6;--up:#1a7a52;--dn:#c0392b;--sel:#e8eef6;
--serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161d;--card:#19212b;--ink:#e6eaef;--muted:#9aa4b0;--navy:#8fb0dc;--line:#2b3542;--up:#4fc08d;--dn:#ef7a6c;--sel:#22324a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161d;--card:#19212b;--ink:#e6eaef;--muted:#9aa4b0;--navy:#8fb0dc;--line:#2b3542;--up:#4fc08d;--dn:#ef7a6c;--sel:#22324a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--serif);font-size:32px;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin:4px 0 0}
.rule{border:0;border-top:3px double var(--ink);margin:14px 0 20px}
.intro{font-family:var(--serif);font-size:17px;margin:0 0 20px}
.q{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin:0 0 14px}
.qn{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--navy);font-weight:bold}
.qt{font-family:var(--serif);font-size:18px;font-weight:bold;margin:6px 0 12px;text-wrap:balance}
.opts{display:grid;gap:8px}
button.opt{all:unset;box-sizing:border-box;display:block;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:5px;font-size:15px;cursor:pointer;color:var(--ink);background:transparent}
button.opt:hover:not([disabled]){background:var(--sel)}
button.opt:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
button.opt[disabled]{cursor:default}
button.opt.right{border-color:var(--up);color:var(--up);font-weight:bold}
button.opt.wrong{border-color:var(--dn);color:var(--dn);text-decoration:line-through}
.why{margin:10px 0 0;font-size:14px;color:var(--muted)}
.why b{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--serif);font-size:20px;font-weight:bold;font-variant-numeric:tabular-nums}
.verdict{font-size:14px;color:var(--muted)}
button.reset{all:unset;cursor:pointer;font-size:14px;color:var(--navy);border:1px solid var(--line);border-radius:5px;padding:7px 12px}
button.reset:focus-visible{outline:2px solid var(--navy)}
body{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Morning Briefing Quiz</h1>
  <p class="meta" id="meta"></p>
  <hr class="rule">
  <p class="intro" id="intro"></p>
  <div id="quiz"></div>
</div>
<div class="bar"><div class="in"><div><div class="score" id="score">0 / 0</div><div class="verdict" id="verdict">Tap an answer to start.</div></div><button class="reset" id="reset" type="button">Start again</button></div></div>
<script>
/* QUIZ DATA: replaced daily. Each question: q, options (4), answer (index), why. */
const QUIZ = {
  date: "Wednesday 25 November 2026",
  intro: "12 questions on today's Morning Briefing. Tap an answer to see whether you're right and why.",
  questions: [
    {q:"Roughly how far did Nvidia shares fall on Tuesday, after Monday's 31% jump?",o:["About 1%","About 7%","About 20%","They rose again"],a:1,w:"Nvidia fell about 7% as chip stocks gave back part of the Huang rally."},
    {q:"Which US index was UP at 1:23 PM New York on Tuesday?",o:["Nasdaq","S&P 500","Dow","None of them"],a:2,w:"The Dow was up 0.81% while the S&P 500 fell 0.48% and the Nasdaq 1.43%."},
    {q:"Which newspaper reported the new US tariff plan on China, the EU and 14 other economies?",o:["The Wall Street Journal","The Financial Times","The Washington Post","The Guardian"],a:0,w:"The WSJ reported the USTR plan, which could be released as soon as this week."},
    {q:"What tariff rate are the EU, Japan and South Korea likely to face under the reported plan?",o:["50% or more","25%","Zero","15% or lower"],a:3,w:"They would likely face 15% or lower, matching their trade deals; China would face the steepest rate."},
    {q:"How much did the ASX 200 rise on Tuesday?",o:["0.3%","1.8%","4.7%","It fell"],a:1,w:"The ASX 200 closed up 1.8% at 8,726, its first daily gain in nearly two weeks."},
    {q:"Under the proposed digital duty of care law, fines could reach what share of a platform's worldwide revenue?",o:["1%","10%","25%","5%"],a:3,w:"Up to 5% of global revenue, versus a previously proposed A$109 million cap."},
    {q:"The PBS cap on a prescription is frozen at what price until 2030?",o:["$25","$7.70","$31.60","$42.50"],a:0,w:"The government extended its medicines price freeze, keeping the maximum at $25."},
    {q:"What does Iran's IRGC say happened to three tankers in the Strait of Hormuz?",o:["They were seized","They were escorted out by the US Navy","They caught fire after hitting mines","They ran aground"],a:2,w:"The IRGC says three tankers caught fire after hitting naval mines."},
    {q:"How many conditions has Iran's top negotiator set before any talks with the US?",o:["Three","Five","Twelve","Seven"],a:3,w:"Tehran demands seven conditions be met before holding any talks."},
    {q:"Anthropic shares slipped below what IPO price?",o:["US$50","US$83","US$100","US$165"],a:1,w:"Reuters had the stock at US$81.60 early, below its US$83 IPO price."},
    {q:"Which Australian music legend died at 83, his family announced?",o:["Molly Meldrum","John Farnham","Jimmy Barnes","Daryl Braithwaite"],a:0,w:"Ian 'Molly' Meldrum died peacefully on Monday after several days in hospital."},
    {q:"What does 'quiddity' mean?",o:["A sudden reversal","A small coin","Excessive caution","The essence of a thing"],a:3,w:"Merriam-Webster: whatever makes something the type that it is; also a trifling point."}
  ]
};
const $=s=>document.querySelector(s);
let answered=0,correct=0;
function verdict(){const n=QUIZ.questions.length;if(answered<n)return `${n-answered} to go.`;const p=correct/n;return p===1?"Perfect. You read every word.":p>=.75?"Strong. You'd hold your own on the desk.":p>=.5?"Passable. Skim the misses.":"Worth a second read of the brief."}
function render(){
  answered=0;correct=0;
  $("#meta").textContent=QUIZ.date+" · "+QUIZ.questions.length+" questions";
  $("#intro").textContent=QUIZ.intro;
  const box=$("#quiz");box.innerHTML="";
  QUIZ.questions.forEach((it,i)=>{
    const d=document.createElement("div");d.className="q";
    d.innerHTML=`<div class="qn">Question ${i+1}</div><div class="qt"></div><div class="opts"></div><p class="why" hidden></p>`;
    d.querySelector(".qt").textContent=it.q;
    const opts=d.querySelector(".opts");
    it.o.forEach((t,j)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.id=`q${i}o${j}`;b.textContent=t;
      b.addEventListener("click",()=>{opts.querySelectorAll("button").forEach((x,k)=>{x.disabled=true;if(k===it.a)x.classList.add("right")});
        if(j!==it.a)b.classList.add("wrong");else correct++;answered++;
        const w=d.querySelector(".why");w.innerHTML=`<b>${j===it.a?"Correct.":"Not quite."}</b> `;w.append(document.createTextNode(it.w));w.hidden=false;update();});
      opts.appendChild(b);});
    box.appendChild(d);});
  update();
}
function update(){$("#score").textContent=`${correct} / ${answered}`;$("#verdict").textContent=answered?verdict():"Tap an answer to start.";}
$("#reset").addEventListener("click",()=>{render();window.scrollTo({top:0,behavior:"smooth"})});
render();
</script>
</body>
</html>
